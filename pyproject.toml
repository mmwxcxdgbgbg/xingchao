[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "affective-engine"
version = "0.1.0"
description = "A long-term psychological state simulation MCP for AI companions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = ["mcp>=1.0.0,<3.0.0", "pydantic>=2.0.0,<3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0,<9.0.0", "pytest-asyncio>=0.21.0,<1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/affective_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
